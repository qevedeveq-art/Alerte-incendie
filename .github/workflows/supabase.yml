# Déploiement des migrations et des Edge Functions vers Supabase.
# Secrets à définir dans Settings > Secrets and variables > Actions :
#   SUPABASE_ACCESS_TOKEN  (jeton personnel Supabase)
#   SUPABASE_PROJECT_REF   (xpcsnxyhjrpvcvsqmaxd)
#   SUPABASE_DB_PASSWORD   (mot de passe Postgres du projet)
name: Déployer Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lier le projet
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Appliquer les migrations
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Déployer les Edge Functions
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
